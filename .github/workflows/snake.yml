name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff4d2e&color_dots=#ebedf0,#f7c9bd,#f59a82,#f26b4c,#ff4d2e
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff4d2e&color_dots=#161b22,#4a2018,#7d2f1f,#c23e24,#ff4d2e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
