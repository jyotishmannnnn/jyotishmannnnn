<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" role="img" aria-label="~/now.log: [building] gloves that record how human hands actually touch things; [tuning] taxel grids until the noise floor stops lying to me; [soldering] more ESP32-S3s than is probably healthy; [learning] what a robot needs to feel before it can be trusted with an egg; [open to] tactile datasets · haptics · humanoids · anything with a sense of touch">
