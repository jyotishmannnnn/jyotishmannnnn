<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" role="img" aria-label="Off the bench: 10.89 s, 100 m sprint. Gold, and a record. #1 in India, Dyrroth main, Mobile Legends. Order., Chaired the UNSC and ICJ at MUN. Words too, Started the Assam Literary Association at VIT. ex-pentester, Broke into systems, legally, for a while. Wormholes, Raised on sci-fi. Still not over it.">
